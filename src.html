<title>فهد المدعث Fahad Al Medath</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* Layout: slim demo bar, white header on a warm off-white ground, beige section surfaces. One family (IBM Plex Sans Arabic), one 14px base with a 5-step scale, 8px spacing grid. */
:root{
  --bg:#faf8f4; --surface:#ffffff; --surface2:#f3efe7; --surface3:#ebe5da; --fg:#2b2a27; --muted:#6f6a62; --line:#e7e1d6; --line2:#d9d2c5;
  --navy:#3a4150; --navy2:#f3efe7; --onnavy:#ffffff;
  --accent:#e8a41c; --accent-fg:#1f1b12; --accent-soft:#fdf1d9; --accent-line:#f1cf85;
  --good:#2e8b57; --good-soft:#e6f4ec; --warn:#b4700a; --warn-soft:#fdf1d9; --bad:#c4473f; --bad-soft:#fbe8e6; --info:#2f6fcf; --info-soft:#e8effb;
  --shadow:0 1px 2px rgba(43,42,39,.05),0 6px 18px rgba(43,42,39,.06); --r:12px; --r-sm:8px;
  --font:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  --display:"IBM Plex Sans Arabic",system-ui,sans-serif;
  --chart-grid:#ece6db; --pic-bg:#f6f3ed;
  --fs-xs:12px; --fs-sm:13px; --fs:14px; --fs-md:16px; --fs-lg:20px; --fs-xl:26px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#1b1a18; --surface:#232220; --surface2:#2b2926; --surface3:#34312d; --fg:#ece8e1; --muted:#a39d93; --line:#3a3733; --line2:#46423c;
  --navy:#2b2926; --navy2:#2b2926; --onnavy:#ece8e1; --accent:#f0b43a; --accent-fg:#1f1b12; --accent-soft:#3a3120; --accent-line:#5a4a26;
  --good:#5cc48a; --good-soft:#1f3328; --warn:#e9a93c; --warn-soft:#3a2d14; --bad:#ef7a72; --bad-soft:#3d2321; --info:#7fa8ec; --info-soft:#1f2a3e;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.35); --chart-grid:#34312d; --pic-bg:#f2efe9; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#1b1a18; --surface:#232220; --surface2:#2b2926; --surface3:#34312d; --fg:#ece8e1; --muted:#a39d93; --line:#3a3733; --line2:#46423c;
  --navy:#2b2926; --navy2:#2b2926; --onnavy:#ece8e1; --accent:#f0b43a; --accent-fg:#1f1b12; --accent-soft:#3a3120; --accent-line:#5a4a26;
  --good:#5cc48a; --good-soft:#1f3328; --warn:#e9a93c; --warn-soft:#3a2d14; --bad:#ef7a72; --bad-soft:#3d2321; --info:#7fa8ec; --info-soft:#1f2a3e;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.35); --chart-grid:#34312d; --pic-bg:#f2efe9; color-scheme:dark }
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:var(--fs);line-height:1.55;-webkit-font-smoothing:antialiased}
body.rtl{direction:rtl}
h1,h2,h3,h4{font-family:var(--font);margin:0;line-height:1.3;text-wrap:balance;font-weight:700}
h1{font-size:var(--fs-xl)}h2{font-size:var(--fs-lg)}h3{font-size:var(--fs-md)}h4{font-size:var(--fs)}
p{margin:0 0 8px}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
img{max-width:100%}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:var(--fs-sm)}
.wrap{max-width:none;margin:0 auto;padding-left:max(16px,2.5vw,env(safe-area-inset-left,0px));padding-right:max(16px,2.5vw,env(safe-area-inset-right,0px))}

/* ---- demo bar ---- */
.demobar{position:sticky;top:env(safe-area-inset-top,0px);z-index:60;background:var(--surface);border-bottom:1px solid var(--line);font-size:var(--fs-xs);padding-block:6px}
.demobar .wrap{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.demobar .tag{background:var(--accent-soft);color:var(--warn);border:1px solid var(--accent-line);padding:1px 8px;border-radius:999px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.demobar .seg{display:flex;border:1px solid var(--line2);border-radius:999px;overflow:hidden;background:var(--surface2)}
.demobar .seg button{padding:3px 12px;color:var(--muted)}
.demobar .seg button.on{background:var(--fg);color:var(--bg);font-weight:600}
.demobar .sp{flex:1}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:34px;height:34px;padding:0 10px;border-radius:999px;color:inherit}
.iconbtn:hover{background:var(--surface2)}
.iconbtn svg{width:18px;height:18px}
.demobar .iconbtn{height:26px;min-width:26px;padding:0 8px}

/* ---- storefront header ---- */
.announce{background:var(--accent-soft);color:var(--fg);text-align:center;font-weight:500;font-size:var(--fs-sm);padding-block:7px;border-bottom:1px solid var(--accent-line)}
.announce .wrap{display:grid;grid-template-columns:28px 1fr 28px;align-items:center;gap:8px}
.announce .txt{grid-column:2}
.announce .x{grid-column:3;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.announce .x:hover{background:rgba(0,0,0,.06);color:var(--fg)}
.announce .x svg{width:16px;height:16px}
header.shop{background:var(--surface);color:var(--fg);border-bottom:1px solid var(--line)}
.hdr{display:flex;align-items:center;gap:16px;padding-block:12px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;cursor:pointer;color:inherit}
.logo .mark{width:40px;height:40px;border-radius:10px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-weight:700;font-size:var(--fs-lg);flex:none}
.logo .nm{display:flex;flex-direction:column;line-height:1.15;text-align:start}
.logo .nm b{font-size:var(--fs-md);font-weight:700}
.logo .nm span{font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.search{flex:1;min-width:220px;display:flex;background:var(--surface2);border:1px solid var(--line);border-radius:10px;position:relative;color:var(--fg)}
.search:focus-within{border-color:var(--accent);background:var(--surface)}
.search input{flex:1;border:0;padding:9px 14px;background:transparent;min-width:0;border-radius:10px;outline:0}
.search .go{background:var(--accent);color:var(--accent-fg);padding:0 16px;border-radius:0 9px 9px 0;font-weight:600}
body.rtl .search .go{border-radius:9px 0 0 9px}
.sugg{position:absolute;top:100%;inset-inline:0;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:10px;margin-top:4px;box-shadow:var(--shadow);z-index:40;overflow:hidden}
.sugg button{display:flex;width:100%;text-align:start;padding:8px 12px;gap:10px;align-items:center;background:none;color:inherit;border-radius:0}
.sugg button:hover{background:var(--surface2)}
.hdr-actions{display:flex;gap:2px;align-items:center}
.hdr-actions .iconbtn{flex-direction:column;gap:0;height:auto;padding:6px 10px;font-size:11px;border-radius:8px;color:var(--muted)}
.hdr-actions .iconbtn:hover{color:var(--fg)}
.hdr-actions .iconbtn svg{width:22px;height:22px}
.badge{position:absolute;top:-2px;inset-inline-end:2px;background:var(--accent);color:var(--accent-fg);font-size:10px;font-weight:700;min-width:17px;height:17px;border-radius:999px;display:grid;place-items:center;padding:0 4px}
.rel{position:relative}
nav.cats{background:var(--surface2);color:var(--fg);border-bottom:1px solid var(--line)}
nav.cats .wrap{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.cats .wrap::-webkit-scrollbar{display:none}
nav.cats button{white-space:nowrap;padding:10px 12px;color:var(--muted);font-size:var(--fs-sm);font-weight:500;border-bottom:2px solid transparent;display:inline-flex;align-items:center;gap:6px}
nav.cats button svg{width:16px;height:16px}
nav.cats button:hover,nav.cats button.on{border-bottom-color:var(--accent);color:var(--fg)}
nav.cats button.hot{color:var(--warn);font-weight:600}

/* ---- generic ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 16px;border-radius:var(--r-sm);font-weight:600;border:1px solid transparent;line-height:1.2;white-space:nowrap;font-size:var(--fs)}
.btn svg{width:16px;height:16px}
.btn.primary{background:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{filter:brightness(1.04)}
.btn.navy{background:var(--fg);color:var(--bg)}
.btn.ghost{border-color:var(--line2);background:var(--surface)}
.btn.ghost:hover{background:var(--surface2)}
.btn.danger{background:var(--bad);color:#fff}
.btn.sm{padding:6px 10px;font-size:var(--fs-sm)}
.btn.lg{padding:12px 22px;font-size:var(--fs-md)}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:var(--fs-xs);font-weight:600;background:var(--surface2);white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.info{background:var(--info-soft);color:var(--info)}.pill.acc{background:var(--accent-soft);color:var(--warn)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g5{grid-template-columns:repeat(5,1fr)}.g6{grid-template-columns:repeat(6,1fr)}
@media(max-width:1000px){.g5,.g6{grid-template-columns:repeat(4,1fr)}.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:620px){.g5,.g6,.g4,.g3,.g2{grid-template-columns:repeat(2,1fr)}.g2.stack,.g3.stack{grid-template-columns:1fr}}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.sec{padding-block:32px;border-top:1px solid var(--line)}
.sec:first-of-type{border-top:0}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px;flex-wrap:wrap;min-height:32px}
.link{color:var(--info);font-weight:600;font-size:var(--fs-sm);text-decoration:none;background:none}
.link:hover{text-decoration:underline}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:var(--fs-sm);font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--line2);background:var(--surface);border-radius:var(--r-sm);padding:9px 12px;width:100%;min-width:0;font-size:var(--fs)}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);outline:0;box-shadow:0 0 0 3px var(--accent-soft)}
.field textarea{min-height:90px;resize:vertical}
.field .hint{font-size:var(--fs-xs);color:var(--muted)}
.field.inline{flex-direction:row;align-items:center;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.field.inline:last-child{border-bottom:0}
.field.inline label{color:var(--fg);font-weight:500;font-size:var(--fs)}
.switch{position:relative;width:40px;height:22px;border-radius:999px;background:var(--line2);flex:none;transition:.15s}
.switch::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.switch.on{background:var(--good)}
.switch.on::after{inset-inline-start:21px}
.toast-wrap{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));inset-inline-end:max(16px,env(safe-area-inset-right,0px));z-index:100;display:flex;flex-direction:column;gap:8px;max-width:min(360px,calc(100% - 32px))}
.toast{background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:10px;box-shadow:var(--shadow);font-size:var(--fs-sm);display:flex;gap:10px;align-items:center;animation:up .2s ease-out;border-inline-start:4px solid var(--accent)}
.toast.good{border-inline-start-color:var(--good)}.toast.bad{border-inline-start-color:var(--bad)}
@keyframes up{from{transform:translateY(10px);opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.modal-bg{position:fixed;inset:0;background:rgba(43,42,39,.45);z-index:80;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--surface);border-radius:16px;max-width:720px;width:100%;max-height:92vh;overflow:auto;box-shadow:var(--shadow)}
.modal.sm{max-width:460px}.modal.lg{max-width:960px}
.modal-h{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:1}
.modal-b{padding:20px}
.modal-f{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.drawer-bg{position:fixed;inset:0;background:rgba(43,42,39,.4);z-index:85}
.drawer{position:fixed;top:0;bottom:0;inset-inline-end:0;width:min(440px,100%);background:var(--surface);z-index:90;box-shadow:var(--shadow);display:flex;flex-direction:column;animation:slide .2s ease-out}
@keyframes slide{from{transform:translateX(20px);opacity:0}}
.drawer-h{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.drawer-b{flex:1;overflow:auto;padding:12px 16px}
.drawer-f{padding:14px 16px;border-top:1px solid var(--line);display:grid;gap:8px}
table.tbl{width:100%;border-collapse:collapse;font-size:var(--fs-sm)}
.tbl th{text-align:start;font-size:var(--fs-xs);letter-spacing:.04em;text-transform:uppercase;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface2)}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr:hover td{background:var(--surface2)}
.tscroll{overflow-x:auto}
.empty{text-align:center;padding:48px 16px;color:var(--muted)}
.empty svg{width:48px;height:48px;opacity:.5;margin-bottom:10px;stroke:currentColor}
.kbd{font-family:ui-monospace,Consolas,monospace;font-size:var(--fs-xs);background:var(--surface2);padding:2px 6px;border-radius:4px;border:1px solid var(--line);word-break:break-all}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs button{padding:9px 14px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;font-size:var(--fs-sm)}
.tabs button.on{color:var(--fg);border-bottom-color:var(--accent)}
.stars{color:var(--accent);letter-spacing:1px;font-size:var(--fs-xs)}
.bc{display:flex;gap:6px;font-size:var(--fs-sm);color:var(--muted);padding-block:14px;flex-wrap:wrap}
.bc button{color:inherit}.bc button:hover{color:var(--fg);text-decoration:underline}

/* ---- hero ---- */
.hero{display:grid;grid-template-columns:2fr 1fr;gap:16px;margin-top:20px}
@media(max-width:900px){.hero{grid-template-columns:1fr}}
.banner{border-radius:16px;padding:32px;min-height:320px;display:flex;flex-direction:column;justify-content:flex-end;gap:8px;color:var(--fg);position:relative;overflow:hidden;background:var(--surface2);border:1px solid var(--line)}
.banner .eyebrow{font-size:var(--fs-xs);letter-spacing:.12em;text-transform:uppercase;color:var(--warn);font-weight:700}
.banner h2{font-size:var(--fs-xl);max-width:24ch;line-height:1.25}
.banner p{margin:0;color:var(--muted);max-width:52ch}
.banner .deco{position:absolute;inset-inline-end:-30px;top:-30px;width:300px;height:300px;opacity:.14;pointer-events:none;stroke:#2b2a27}
.banner{color:#2b2a27}.banner p{color:#5b564e}.banner .eyebrow{color:#a8650a}.banner .dots button{background:rgba(43,42,39,.25)}
.banner .dots{position:absolute;bottom:14px;inset-inline-end:18px;display:flex;gap:6px}
.banner .dots button{width:8px;height:8px;border-radius:50%;background:var(--line2)}
.banner .dots button.on{background:var(--accent);width:22px;border-radius:4px}
.side-banners{display:grid;gap:16px;grid-template-rows:1fr 1fr}
.mini-banner{border-radius:16px;padding:20px;display:flex;flex-direction:column;justify-content:space-between;background:var(--surface);border:1px solid var(--line);gap:10px}
.mini-banner b{font-size:var(--fs-md);font-weight:700}
.cat-tile{display:flex;flex-direction:column;align-items:center;gap:10px;padding:18px 8px;text-align:center;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);font-size:var(--fs-sm);font-weight:600;color:inherit;transition:.15s;min-height:124px;justify-content:center}
.cat-tile:hover{border-color:var(--accent-line);background:var(--accent-soft)}
.cat-tile .ic{width:52px;height:52px;border-radius:50%;background:var(--surface2);display:grid;place-items:center}
.cat-tile:hover .ic{background:var(--surface)}
.cat-tile svg{width:26px;height:26px;stroke:var(--fg)}
.trust{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:800px){.trust{grid-template-columns:repeat(2,1fr)}}
.trust div{display:flex;gap:12px;align-items:center;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);font-size:var(--fs-sm);min-height:72px}
.trust svg{width:26px;height:26px;flex:none;stroke:var(--warn)}
.trust b{display:block;font-size:var(--fs)}
.brands{display:flex;gap:10px;flex-wrap:wrap}
.brands button{padding:8px 16px;border:1px solid var(--line);border-radius:999px;font-weight:600;font-size:var(--fs-sm);background:var(--surface);letter-spacing:.02em;color:var(--muted)}
.brands button:hover{border-color:var(--accent-line);color:var(--fg);background:var(--accent-soft)}
.countdown{display:inline-flex;gap:4px;font-weight:700}
.countdown span{background:var(--fg);color:var(--bg);border-radius:6px;padding:2px 7px;min-width:34px;text-align:center;font-variant-numeric:tabular-nums;font-size:var(--fs-sm)}

/* ---- product card ---- */
.pcard{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;position:relative;transition:.15s}
.pcard:hover{box-shadow:var(--shadow);border-color:var(--line2)}
.pimg{aspect-ratio:1;max-width:100%;display:grid;place-items:center;position:relative;cursor:pointer;background:var(--pic-bg);border-bottom:1px solid var(--line)}
.pimg .pic{width:76%;height:76%;display:block}
.pimg .ph{position:absolute;bottom:6px;inset-inline-end:8px;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:#8a847a;border:1px dashed #d6cfc2;padding:1px 6px;border-radius:4px;background:rgba(255,255,255,.7)}
.pimg .tags{position:absolute;top:8px;inset-inline-start:8px;display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.wish{position:absolute;top:8px;inset-inline-end:8px;width:30px;height:30px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 1px 4px rgba(0,0,0,.12);color:#2b2a27}
.wish svg{width:16px!important;height:16px!important;opacity:1!important;stroke-width:2!important;fill:none}
.wish.on svg{fill:var(--bad);stroke:var(--bad)}
.pbody{padding:12px 14px 14px;display:grid;gap:4px;flex:1;grid-template-rows:16px 42px 18px 26px 16px 20px 16px auto}
.pbrand{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600;line-height:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pname{font-weight:600;font-size:var(--fs);line-height:21px;cursor:pointer;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-align:start}
.pname:hover{color:var(--info)}
.pcard .stars{line-height:18px}
.price{display:flex;gap:8px;align-items:baseline;flex-wrap:nowrap;overflow:hidden;line-height:26px}
.price b{font-size:var(--fs-md);font-weight:700;font-variant-numeric:tabular-nums}
.price s{color:var(--muted);font-size:var(--fs-xs)}
.vatnote{font-size:11px;color:var(--muted);line-height:16px}
.bnpl{font-size:var(--fs-xs);color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:nowrap;white-space:nowrap;overflow:hidden;line-height:20px;min-height:20px}
.lg{font-weight:700;font-size:11px;padding:2px 7px;border-radius:4px;color:#fff;letter-spacing:.02em;white-space:nowrap;display:inline-block;line-height:1.4}

const KEY='fam_demo_v1';
let S, D, U;
const clone=o=>JSON.parse(JSON.stringify(o));
function merge(base, over){ if(Array.isArray(base)||typeof base!=='object'||base===null) return over===undefined?base:over; const out={...base}; for(const k in over){ out[k]=(typeof base[k]==='object'&&base[k]!==null&&!Array.isArray(base[k]))?merge(base[k],over[k]):over[k]; } return out; }

  D = saved&&saved.D ? saved.D : {products:clone(PRODUCTS), orders:clone(SEED_ORDERS), customers:clone(CUSTOMERS), whlog:[], audit:[], reviews:{}};

  U.f = U.f || {brands:[],min:'',max:'',rating:0,stock:false,saber:false,sort:'pop'};

const cartQty=()=>U.cart.reduce((a,c)=>a+c.qty,0);
function enabledCarriers(){ return S.shipping.carriers.filter(c=>c.enabled); }
function totals(){
  const lines=U.cart.map(c=>({...c,p:prod(c.id)})).filter(c=>c.p);
  const sub=lines.reduce((a,c)=>a+c.p.price*c.qty,0);
  let disc=0; const cp=U.coupon?S.coupons.find(c=>c.code===U.coupon&&c.active):null;
  if(cp && sub>=cp.min){ disc=cp.type==='pct'?sub*cp.value/100:Math.min(cp.value,sub); }
  const afterDisc=sub-disc;
  const co=U.co||{}; const carrier=S.shipping.carriers.find(c=>c.id===co.carrier);
  let ship=carrier?carrier.price:null;
  if(carrier && carrier.id!=='pickup' && afterDisc>=S.shipping.freeThreshold) ship=0;
  const codFee=co.pm==='cod'?S.payments.cod.fee:0;
  let vat, net, total;
  if(S.tax.pricesIncludeVat){ net=afterDisc/(1+vatR()); vat=afterDisc-net; total=afterDisc+(ship||0)+codFee; }
  else { net=afterDisc; vat=afterDisc*vatR(); total=afterDisc+vat+(ship||0)+codFee; }
  return {lines,sub,disc,afterDisc,ship,codFee,vat,net,total,cp};
}
function addCart(id, qty){ const p=prod(id); if(!p||p.stock<=0) return; const l=U.cart.find(c=>c.id===id); if(l) l.qty=Math.min(l.qty+(qty||1), p.stock); else U.cart.push({id,qty:qty||1}); save(); toast(t('added'),'good'); render(); }

function filtered(){
  let list=D.products.filter(p=>p.active!==false);
  const {cat:c,q}=U.params, f=U.f;
  if(c==='deals') list=list.filter(p=>p.old); else if(c) list=list.filter(p=>p.cat===c);
  if(q){ const s=q.toLowerCase(); list=list.filter(p=>p.name.ar.includes(q)||p.name.en.toLowerCase().includes(s)||p.brand.toLowerCase().includes(s)||catName(p.cat).toLowerCase().includes(s)); }
  if(f.brands.length) list=list.filter(p=>f.brands.includes(p.brand));
  if(f.min!=='') list=list.filter(p=>p.price>=+f.min); if(f.max!=='') list=list.filter(p=>p.price<=+f.max);
  if(f.rating) list=list.filter(p=>p.rating>=f.rating); if(f.stock) list=list.filter(p=>p.stock>0); if(f.saber) list=list.filter(p=>p.saber);
  const s=f.sort; if(s==='lo') list.sort((a,b)=>a.price-b.price); else if(s==='hi') list.sort((a,b)=>b.price-a.price); else if(s==='rate') list.sort((a,b)=>b.rating-a.rating); else if(s==='new') list.sort((a,b)=>(b.badges.includes('new')?1:0)-(a.badges.includes('new')?1:0)); else list.sort((a,b)=>b.reviews-a.reviews);
  return list;
}

<script>
/* ================= CHECKOUT ================= */
function newCo(){ const c=enabledCarriers()[0]; return {step:1, phone:'', otpSent:false, verified:!!U.user, name:U.user?U.user.name:'', email:'', addr:{short:'',building:'',street:'',district:'',city:S.shipping.cities[0]||'الرياض',postal:'',addl:''}, carrier:c?c.id:null, pm:null, agree:false, notes:'', card:{num:'',exp:'',cvv:'',name:'',save:false}, stcPhone:''}; }
function startCheckout(){ if(!U.cart.length) return; if(!U.co) U.co=newCo(); if(U.user){U.co.verified=true; if(U.co.step===1) U.co.step=2;} closeModal(); go('checkout'); }
function viewCheckout(){
  if(!U.cart.length) return viewCart();
  const co=U.co||(U.co=newCo()); const tt=totals();
  const steps=['step1','step2','step3','step4','step5'];
  const stepsHtml=`<div class="steps">${steps.map((s,i)=>`<div class="${co.step===i+1?'on':co.step>i+1?'done':''}">${i+1}. ${t(s)}</div>`).join('')}</div>`;
  let body='';
  if(co.step===1){
    body=`<h2>${t('step1')}</h2><p class="muted small">${S.checkout.otpLogin?t('otp_hint'):''}</p>
      <div class="form"><div class="cols2"><div class="field"><label>${t('phone')}</label><input class="ltr" data-co="phone" value="${esc(co.phone)}" placeholder="05XXXXXXXX" inputmode="tel"></div>
      ${co.otpSent?`<div class="field"><label>${t('otp')}</label><input class="ltr" data-co="otp" placeholder="••••" inputmode="numeric" maxlength="4"></div>`:''}</div>
      <div class="row">${!co.otpSent?`<button class="btn primary" data-act="coOtp">${t('send_otp')}</button>`:`<button class="btn primary" data-act="coVerify">${t('verify')}</button>`}${S.checkout.guest?`<button class="btn ghost" data-act="coGuest">${t('guest')}</button>`:''}</div></div>`;
  } else if(co.step===2){
    body=`<h2>${t('step2')}</h2>
      <div class="form"><div class="cols2"><div class="field"><label>${t('full_name')}</label><input data-co="name" value="${esc(co.name)}" required></div><div class="field"><label>${t('email')}</label><input data-co="email" type="email" value="${esc(co.email)}"></div></div>
      <div class="card" style="padding:14px;background:var(--surface2)"><div class="row between" style="margin-bottom:10px"><b>${t('nat_addr')} ${S.checkout.requireNationalAddress?'<span class="pill warn">'+(isAr()?'إلزامي':'Required')+'</span>':''}</b><span class="lg lg-spl">SPL</span></div>
        <div class="keyrow"><div class="field"><label>${t('short_code')}</label><input class="ltr" data-co="addr.short" value="${esc(co.addr.short)}" placeholder="RRRD2929" style="text-transform:uppercase"></div><button class="btn ghost" data-act="coLookup">${t('lookup')}</button></div>
        <div class="cols3" style="margin-top:10px"><div class="field"><label>${t('building')}</label><input class="ltr" data-co="addr.building" value="${esc(co.addr.building)}"></div><div class="field"><label>${t('street')}</label><input data-co="addr.street" value="${esc(co.addr.street)}"></div><div class="field"><label>${t('district')}</label><input data-co="addr.district" value="${esc(co.addr.district)}"></div>
        <div class="field"><label>${t('city')}</label><select data-co="addr.city">${S.shipping.cities.map(c=>`<option ${co.addr.city===c?'selected':''}>${esc(c)}</option>`).join('')}</select></div><div class="field"><label>${t('postal')}</label><input class="ltr" data-co="addr.postal" value="${esc(co.addr.postal)}"></div><div class="field"><label>${t('addl')}</label><input class="ltr" data-co="addr.addl" value="${esc(co.addr.addl)}"></div></div></div>
      ${S.checkout.notes?`<div class="field"><label>${t('notes')}</label><input data-co="notes" value="${esc(co.notes)}" placeholder="${isAr()?'مثال: اتصل قبل الوصول، البوابة الخلفية':'e.g. call before arrival, back gate'}"></div>`:''}
      <div class="row between"><button class="btn ghost" data-act="coBack">←</button><button class="btn primary" data-act="coNext">${t('step3')} →</button></div></div>`;
  } else if(co.step===3){
    body=`<h2>${t('ship_method')}</h2><div class="paymethods">${enabledCarriers().map(c=>{const free=c.id!=='pickup'&&tt.afterDisc>=S.shipping.freeThreshold; return `<button class="pm ${co.carrier===c.id?'on':''}" data-act="coCarrier" data-id="${c.id}"><span class="radio"></span><span class="lg ${c.lg}">${esc(c.name.split(' ')[0])}</span><span><b>${esc(c.name)}</b><div class="small muted">${c.days==='0'?(isAr()?'اليوم':'Today'):c.days==='0–1'?t('same_day'):c.days+' '+t('days')}</div></span><span class="logos num"><b>${c.price===0||free?t('free'):money(c.price)}</b></span></button>`;}).join('')}</div>
      <div class="row between" style="margin-top:16px"><button class="btn ghost" data-act="coBack">←</button><button class="btn primary" data-act="coNext">${t('step4')} →</button></div>`;
  } else if(co.step===4){
    const pays=availablePayments(tt.total); if(co.pm&&!pays.some(p=>p.id===co.pm)) co.pm=null;
    const gw=cardGateway();
    const form=id=>{
      if(id==='mada'||id==='visa_mc') return `<div class="pm-form"><div class="row small muted" style="justify-content:space-between"><span>${isAr()?'تتم معالجة البطاقة بأمان عبر':'Card processed securely by'} <b>${gwLabel[gw]}</b> · PCI-DSS</span><span class="pill warn">${t('test_mode')}</span></div>
        <div class="field"><label>${t('card_no')}</label><input class="ltr" data-co="card.num" value="${esc(co.card.num)}" placeholder="${id==='mada'?'4464 04•• •••• ••••':'4111 1111 1111 1111'}" inputmode="numeric"></div>
        <div class="cols3"><div class="field"><label>${t('expiry')}</label><input class="ltr" data-co="card.exp" value="${esc(co.card.exp)}" placeholder="MM/YY"></div><div class="field"><label>${t('cvv')}</label><input class="ltr" data-co="card.cvv" type="password" placeholder="•••" maxlength="4"></div><div class="field"><label>${t('card_name')}</label><input data-co="card.name" value="${esc(co.card.name)}"></div></div>
        <label class="chk"><input type="checkbox" data-co="card.save" ${co.card.save?'checked':''}>${t('save_card')}</label></div>`;
      if(id==='applepay') return `<div class="pm-form"><button class="applepay" data-act="coPay"> Pay</button><div class="small muted">${isAr()?'Apple Pay يمثّل أكثر من 30% من المدفوعات الإلكترونية في السعودية':'Apple Pay carries over 30% of Saudi online payments'}</div></div>`;
      if(id==='stcpay'||id==='samsungpay') return `<div class="pm-form"><div class="field"><label>${t('phone')}</label><input class="ltr" data-co="stcPhone" value="${esc(co.stcPhone||co.phone)}" placeholder="05XXXXXXXX"></div><div class="small muted">${t('stc_hint')}</div></div>`;
      if(id==='tabby') return `<div class="pm-form"><div class="installments">${[0,1,2,3].map(i=>`<div><b>${money(tt.total/4)}</b>${i===0?(isAr()?'اليوم':'Today'):fmtDate(Date.now()+i*30*864e5)}</div>`).join('')}</div><div class="small muted">${t('tabby_hint')}</div></div>`;
      if(id==='tamara'){ const k=S.payments.tamara.instalments; return `<div class="pm-form"><div class="installments" style="grid-template-columns:repeat(${Math.min(k,4)},1fr)">${Array.from({length:Math.min(k,4)},(_,i)=>`<div><b>${money(tt.total/k)}</b>${i===0?(isAr()?'اليوم':'Today'):fmtDate(Date.now()+i*30*864e5)}</div>`).join('')}</div><div class="small muted">${t('tamara_hint')}</div></div>`; }
      if(id==='cod') return `<div class="pm-form"><div class="small">${t('cod_hint',{n:money(S.payments.cod.fee),m:money(S.payments.cod.maxOrder)})}</div></div>`;
      if(id==='bank') return `<div class="pm-form"><div class="small">${t('bank_hint',{h:S.payments.bank.holdHours})}</div><div class="row between"><span class="small muted">${t('bank_name')}</span><b>${esc(S.payments.bank.bankName)}</b></div><div class="row between"><span class="small muted">${t('iban')}</span><span class="row"><span class="kbd">${esc(S.payments.bank.iban)}</span><button class="iconbtn" data-act="copy" data-v="${esc(S.payments.bank.iban)}">${I.copy}</button></span></div><div class="row between"><span class="small muted">${t('acct_name')}</span><b>${esc(S.payments.bank.accountName)}</b></div></div>`;
      if(id==='sadad') return `<div class="pm-form"><div class="small">${isAr()?'سيُصدر رقم فاتورة سداد يمكن دفعه من أي بنك سعودي خلال 48 ساعة.':'A SADAD bill number will be issued, payable from any Saudi bank within 48 hours.'}</div></div>`;
      return '';
    };
    const label=id=>{const m=PM_META[id]; return isAr()?m.ar:m.name;};
    const sub=id=>({mada:isAr()?'بطاقات مدى البنكية':'Saudi debit cards',visa_mc:isAr()?'بطاقات الائتمان':'Credit cards',applepay:isAr()?'ادفع ببصمة الوجه أو الإصبع':'Face ID / Touch ID',stcpay:isAr()?'محفظة stc pay':'stc pay wallet',samsungpay:'Samsung Wallet',tabby:isAr()?'4 دفعات بدون فوائد':'4 interest-free payments',tamara:isAr()?`قسّطها على ${S.payments.tamara.instalments} دفعات`:`Split in ${S.payments.tamara.instalments} payments`,cod:isAr()?`رسوم ${money(S.payments.cod.fee)}`:`Fee ${money(S.payments.cod.fee)}`,bank:isAr()?'للمقاولين والطلبات الكبيرة':'For contractors and large orders',sadad:isAr()?'فاتورة سداد':'SADAD bill'}[id]||'');
    const logos=id=>id==='visa_mc'?`${pmPill('visa_mc')}${S.payments.moyasar.methods.amex?pmPill('amex'):''}`:pmPill(id);
    body=`<h2>${t('pay_method')}</h2>${pays.length?`<div class="paymethods">${pays.map(p=>`<div><button class="pm ${co.pm===p.id?'on':''}" data-act="coPm" data-id="${p.id}"><span class="radio"></span><span><b>${label(p.id)}</b><div class="small muted">${sub(p.id)}</div></span><span class="logos">${logos(p.id)}</span></button>${co.pm===p.id?form(p.id):''}</div>`).join('')}</div>`:`<div class="alert warn">${I.warn}<span>${isAr()?'لا توجد طرق دفع مفعّلة لهذا المبلغ. فعّل بوابة من لوحة التحكم.':'No payment methods enabled for this amount. Enable a gateway in the admin panel.'}</span></div>`}
      <div class="row between" style="margin-top:16px"><button class="btn ghost" data-act="coBack">←</button><button class="btn primary" data-act="coNext" ${co.pm?'':'disabled'}>${t('step5')} →</button></div>`;
  } else {
    const carrier=S.shipping.carriers.find(c=>c.id===co.carrier)||{};
    body=`<h2>${t('step5')}</h2>
      <div class="card" style="padding:4px 14px;margin-bottom:12px">${cartLines(true)}</div>
      <div class="cols3"><div class="card" style="padding:12px"><div class="small muted">${t('ship_to')}</div><b>${esc(co.name)}</b><div class="small">${esc([co.addr.building,co.addr.street,co.addr.district,co.addr.city,co.addr.postal].filter(Boolean).join(', '))}</div><div class="small ltr" style="text-align:start">${esc(co.phone)}</div></div>
      <div class="card" style="padding:12px"><div class="small muted">${t('ship_method')}</div><b>${esc(carrier.name||'')}</b><div class="small">${tt.ship===0?t('free'):money(tt.ship||0)}</div></div>
      <div class="card" style="padding:12px"><div class="small muted">${t('pay_method')}</div><b>${PM_META[co.pm]?(isAr()?PM_META[co.pm].ar:PM_META[co.pm].name):''}</b><div>${pmPill(co.pm)}</div></div></div>
      ${S.checkout.terms?`<label class="chk" style="margin-top:14px"><input type="checkbox" data-co="agree" ${co.agree?'checked':''}>${t('agree')}</label>`:''}
      <div class="row between" style="margin-top:16px"><button class="btn ghost" data-act="coBack">←</button><button class="btn primary lg" data-act="coPay">${I.lock} ${['cod','bank','sadad'].includes(co.pm)?t('place_order'):t('pay_now')} · ${money(tt.total)}</button></div>`;
  }
  return `<div class="wrap"><div class="bc"><button data-act="go" data-v="home">${t('home')}</button> › <button data-act="go" data-v="cart">${t('your_cart')}</button> › ${t('checkout')}</div>
    <div class="checkout"><div class="card" style="padding:20px">${stepsHtml}${body}</div>${summaryBox(false)}</div></div>`;
}

/* ---- payment simulation ---- */
function simulatePayment(){
  const co=U.co, tt=totals(); const pm=co.pm; const gw=['mada','visa_mc','applepay','stcpay','samsungpay'].includes(pm)?gwLabel[cardGateway()]:gwLabel[pm];
  if(S.checkout.terms && !co.agree && co.step===5){ toast(t('agree'),'bad'); return; }
  if(['cod','bank','sadad'].includes(pm)){ placeOrder(pm==='cod'?'processing':'pending'); return; }
  const spin=(title,sub)=>openModal(`<div class="processing"><div class="spinner"></div><h3>${esc(title)}</h3><p class="muted small">${esc(sub)}</p></div>`,'sm');
  spin(t('processing'), t('proc_sub',{g:gw}));
  const brandBg={tabby:'#3bff9f',tamara:'#d04e5f',applepay:'#000',stcpay:'#4f008c',samsungpay:'#1428a0'}[pm]||'#2d5bff';
  const fg=pm==='tabby'?'#0a3b24':'#fff';
  setTimeout(()=>{
    if(pm==='tabby'||pm==='tamara'){
      const k=pm==='tabby'?4:S.payments.tamara.instalments;
      openModal(`<div style="background:${brandBg};color:${fg};padding:18px 22px;border-radius:14px 14px 0 0;display:flex;justify-content:space-between;align-items:center"><b style="font-family:var(--display);font-size:1.4rem;text-transform:lowercase">${pm}</b><span class="small" style="opacity:.85">${isAr()?'صفحة دفع تجريبية (sandbox)':'Hosted checkout (sandbox)'}</span></div>
        <div class="modal-b"><div class="row between"><span class="muted">${esc(storeName())}</span><b class="num">${money(tt.total)}</b></div>
        <div class="installments" style="margin:14px 0;grid-template-columns:repeat(${Math.min(k,4)},1fr)">${Array.from({length:Math.min(k,4)},(_,i)=>`<div><b>${money(tt.total/k)}</b>${i===0?(isAr()?'اليوم':'Today'):fmtDate(Date.now()+i*30*864e5)}</div>`).join('')}</div>
        <div class="form"><div class="field"><label>${t('phone')}</label><input class="ltr" value="${esc(co.phone||'05XXXXXXXX')}"></div><div class="field"><label>${isAr()?'رقم الهوية / الإقامة':'National ID / Iqama'}</label><input class="ltr" placeholder="1XXXXXXXXX"></div><div class="field"><label>${t('otp')}</label><input class="ltr" placeholder="••••"></div></div>
        <p class="small muted" style="margin:12px 0 0">${isAr()?'بالمتابعة توافق على اتفاقية التقسيط. لا توجد فوائد أو رسوم تأخير مخفية (وفق قواعد البنك المركزي للشراء الآن والدفع لاحقاً).':'By continuing you accept the instalment agreement. No interest and no hidden late fees (per SAMA BNPL rules).'}</p></div>
        <div class="modal-f"><button class="btn ghost" data-act="payFail">${isAr()?'رفض (محاكاة)':'Decline (simulate)'}</button><button class="btn lg" style="background:${brandBg};color:${fg}" data-act="payOk">${isAr()?'تأكيد الدفع':'Confirm payment'}</button></div>`,'sm');
    } else if(pm==='applepay'){
      openModal(`<div class="modal-b" style="text-align:center"><div style="font-size:1.6rem;font-weight:700"> Pay</div><div class="card" style="padding:12px;margin:14px 0;text-align:start"><div class="row between"><span>${esc(storeName())}</span><b class="num">${money(tt.total)}</b></div><div class="row between small muted"><span>mada Debit •••• 4421</span><span>${esc(co.addr.city)}</span></div></div><div class="muted small">${isAr()?'انقر مرتين للتأكيد بالوجه':'Double-click side button to pay with Face ID'}</div></div><div class="modal-f" style="justify-content:center"><button class="btn ghost" data-act="payFail">${t('cancel')}</button><button class="btn navy lg" data-act="payOk">${isAr()?'تأكيد بـ Face ID':'Confirm with Face ID'}</button></div>`,'sm');
    } else if(pm==='stcpay'||pm==='samsungpay'){
      openModal(`<div style="background:${brandBg};color:#fff;padding:18px 22px;border-radius:14px 14px 0 0"><b style="font-family:var(--display);font-size:1.3rem">${pm==='stcpay'?'stc pay':'Samsung Pay'}</b></div><div class="modal-b"><p>${isAr()?`أُرسل طلب دفع بقيمة <b>${money(tt.total)}</b> إلى ${esc(co.stcPhone||co.phone)}. افتح التطبيق واعتمد الدفع.`:`A payment request of <b>${money(tt.total)}</b> was sent to ${esc(co.stcPhone||co.phone)}. Open the app and approve.`}</p><div class="field"><label>${t('otp')}</label><input class="ltr" placeholder="••••"></div></div><div class="modal-f"><button class="btn ghost" data-act="payFail">${isAr()?'رفض':'Decline'}</button><button class="btn lg" style="background:${brandBg};color:#fff" data-act="payOk">${isAr()?'اعتماد (محاكاة التطبيق)':'Approve (simulate app)'}</button></div>`,'sm');
    } else {
      openModal(`<div class="modal-b"><div class="row between"><b>3-D Secure</b><span class="lg ${pm==='mada'?'lg-mada':'lg-visa'}">${pm==='mada'?'mada':'VISA'}</span></div><p class="small muted">${isAr()?'أُرسل رمز تحقق من بنكك إلى جوالك المسجّل. (محاكاة – أدخل أي رقم)':'Your bank sent a verification code to your registered mobile. (Simulation – enter anything)'}</p><div class="row between small"><span>${esc(storeName())}</span><b class="num">${money(tt.total)}</b></div><div class="field" style="margin-top:10px"><label>${t('otp')}</label><input class="ltr" placeholder="••••••"></div></div><div class="modal-f"><button class="btn ghost" data-act="payFail">${t('cancel')}</button><button class="btn primary" data-act="payOk">${t('verify')}</button></div>`,'sm');
    }
  }, 1400);
}
function placeOrder(status){
  const tt=totals(); const co=U.co;
  const id='FAM-'+(100419+D.orders.filter(o=>o.session).length);
  const inv=S.tax.invoicePrefix+S.tax.nextInvoice; S.tax.nextInvoice++;
  const order={id, cust:U.user?U.user.id:'guest', custName:co.name||(U.user&&U.user.name)||'Guest', phone:co.phone, items:tt.lines.map(l=>[l.id,l.qty]), pm:co.pm, status, date:new Date().toISOString(), ship:co.carrier, invoice:inv, total:tt.total, vat:tt.vat, disc:tt.disc, shipFee:tt.ship||0, codFee:tt.codFee, addr:{...co.addr}, session:true, gwRef:(co.pm==='bank'?'TRF-':'pay_')+Math.random().toString(36).slice(2,12), zatca:S.tax.zatcaEnabled?'reported':'off'};
  D.orders.unshift(order);
  tt.lines.forEach(l=>{ l.p.stock=Math.max(0,l.p.stock-l.qty); });
  if(tt.cp) tt.cp.uses++;
  D.whlog.unshift({at:new Date().toISOString(), ev:'order.created', id, code:200}); if(status==='paid'||status==='processing') D.whlog.unshift({at:new Date().toISOString(), ev:'order.paid', id, code:200});
  audit(`Order ${id} placed via ${co.pm}`);
  U.cart=[]; U.coupon=null; U.co=null; closeModal(); save(); go('confirm',{id});
}

/* ================= CONFIRMATION & INVOICE ================= */
function tlvBase64(o){ const enc=new TextEncoder(); const tot=orderTotal(o); const vat=o.vat??(S.tax.pricesIncludeVat?tot-tot/(1+vatR()):tot*vatR()/(1+vatR())); const tags=[[1,S.store.nameAr],[2,S.store.vat],[3,o.date],[4,tot.toFixed(2)],[5,vat.toFixed(2)]]; const bytes=[]; tags.forEach(([t,v])=>{const b=enc.encode(String(v)); bytes.push(t,b.length,...b);}); let s=''; bytes.forEach(b=>s+=String.fromCharCode(b)); return btoa(s); }
function drawQR(canvas, seed){ const n=25, ctx=canvas.getContext('2d'); canvas.width=n; canvas.height=n; ctx.fillStyle='#fff'; ctx.fillRect(0,0,n,n); ctx.fillStyle='#000'; let h=2166136261; for(let i=0;i<seed.length;i++){h^=seed.charCodeAt(i);h=Math.imul(h,16777619);} const rnd=()=>{h^=h<<13;h^=h>>>17;h^=h<<5;return (h>>>0)/4294967296;}; for(let y=0;y<n;y++)for(let x=0;x<n;x++){ if(rnd()>0.5) ctx.fillRect(x,y,1,1); } const fp=(x,y)=>{ctx.fillStyle='#000';ctx.fillRect(x,y,7,7);ctx.fillStyle='#fff';ctx.fillRect(x+1,y+1,5,5);ctx.fillStyle='#000';ctx.fillRect(x+2,y+2,3,3);}; ctx.fillStyle='#fff'; ctx.fillRect(0,0,8,8); ctx.fillRect(n-8,0,8,8); ctx.fillRect(0,n-8,8,8); fp(0,0); fp(n-7,0); fp(0,n-7); }
function invoiceHtml(o){
  const lines=o.items.map(([id,q])=>({p:prod(id),q})).filter(l=>l.p);
  const sub=lines.reduce((a,l)=>a+l.p.price*l.q,0); const sv=S.tax.pricesIncludeVat?{net:sub/(1+vatR()),vat:sub-sub/(1+vatR())}:{net:sub,vat:sub*vatR()};
  const total=orderTotal(o);
  const vat=o.vat??sv.vat;
  if(o.shipFee==null){ const extra=total-sub-(o.pm==='cod'?S.payments.cod.fee:0); o={...o, shipFee:extra>0?extra:0, codFee:o.pm==='cod'?S.payments.cod.fee:0}; }
  return `<div class="invoice"><div class="ih"><div><b style="font-family:var(--display);font-size:1.1rem">${t('tax_invoice')}</b><div class="small muted">Simplified Tax Invoice · فاتورة ضريبية مبسطة</div></div><div class="ltr" style="text-align:end"><div><b>${o.invoice}</b></div><div class="small muted">${fmtDT(o.date)}</div></div></div>

/* ================= DASHBOARD ================= */
function salesChart(){
  const data=SALES30, W=680, H=220, pl=46, pr=14, pt=16, pb=28; const max=Math.ceil(Math.max(...data)/5000)*5000;
  const x=i=>pl+i*(W-pl-pr)/(data.length-1), y=v=>pt+(H-pt-pb)*(1-v/max);
  const pts=data.map((v,i)=>[x(i),y(v)]); const path='M'+pts.map(p=>p.map(n=>n.toFixed(1)).join(',')).join('L');
  const area=path+`L${x(data.length-1).toFixed(1)},${y(0)}L${pl},${y(0)}Z`;
  const ticks=[0,max/4,max/2,max*3/4,max];
  const d0=new Date(Date.now()-29*864e5); const lbl=i=>{const d=new Date(d0.getTime()+i*864e5); return d.toLocaleDateString(LOC(),{day:'numeric',month:'short'});};
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" data-chart="sales" role="img" aria-label="${t('sales30')}">
    <g class="grid">${ticks.map(v=>`<line class="gl" x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end">${(v/1000)}k</text>`).join('')}</g>
    ${[0,7,14,21,29].map(i=>`<text x="${x(i)}" y="${H-8}" text-anchor="middle">${lbl(i)}</text>`).join('')}
    <path class="area" d="${area}"/><path class="line" d="${path}"/>
    <circle class="pt" cx="${x(29)}" cy="${y(data[29])}" r="4"/>
    ${pts.map((p,i)=>`<rect class="hit" x="${(p[0]-(W-pl-pr)/data.length/2).toFixed(1)}" y="${pt}" width="${((W-pl-pr)/data.length).toFixed(1)}" height="${H-pt-pb}" data-ci="${i}" data-cx="${p[0].toFixed(1)}" data-cy="${p[1].toFixed(1)}" data-lbl="${lbl(i)}" data-val="${money(data[i])}"/>`).join('')}
    <g class="tt" id="ctt" hidden><circle class="pt" r="4"/><rect rx="4" width="130" height="36" y="-46" x="-65"/><text x="0" y="-31" text-anchor="middle" style="fill:var(--bg);font-size:10px;font-weight:400"></text><text x="0" y="-17" text-anchor="middle"></text></g></svg>`;
}
function viewDash(){

      ${panel(t('pm_split'), pmRows.map(([pm,v])=>`<div class="hbar"><span>${pmPill(pm)}</span><div class="track"><i style="width:${(v/pmTot*100).toFixed(0)}%"></i></div><span class="v">${(v/pmTot*100).toFixed(0)}%</span></div>`).join(''))}
    </div>
    <div class="grid g3 stack" style="grid-template-columns:2fr 1fr">

      <div style="display:grid;gap:16px;align-content:start">
        ${panel(t('low_stock_t'), low.length?low.slice(0,6).map(p=>`<div class="row between small" style="padding:5px 0;border-bottom:1px solid var(--line)"><span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(L(p.name))}</span><span class="pill ${p.stock===0?'bad':'warn'}">${p.stock}</span></div>`).join(''):`<div class="muted small">—</div>`)}

      </div></div>`;

    [nz(S.store.cr),isAr()?'سجل تجاري ساري وظاهر في تذييل المتجر':'Valid CR number shown in the footer',isAr()?'بيانات المتجر':'Store details','store'],
    [nz(S.store.vat),isAr()?'رقم التسجيل في ضريبة القيمة المضافة':'VAT registration number',isAr()?'بيانات المتجر':'Store details','store'],
    [nz(S.store.bizPlatform),isAr()?'توثيق المتجر في منصة الأعمال (المركز السعودي للأعمال) – بديل معروف':'Store verified on the Saudi Business Center platform (Maroof successor)','','store'],
    [S.tax.pricesIncludeVat&&S.tax.vatRate===15,isAr()?'الأسعار شاملة ضريبة 15% حسب نظام التجارة الإلكترونية':'Prices include 15% VAT per the E-Commerce Law','','tax'],

    [S.legal.returnDays>=7,isAr()?'سياسة استرجاع لا تقل عن 7 أيام ومنشورة':'Published return policy of at least 7 days','','legal'],
    [S.locale.enableAr,isAr()?'واجهة ومعلومات بالعربية':'Arabic interface and disclosures','','locale'],

    [S.payments.tabby.enabled||S.payments.tamara.enabled,isAr()?'خيار الشراء الآن والدفع لاحقاً من مزوّد مرخّص':'BNPL option from a licensed provider','','payments'],
    [S.integrations.saber.enabled,isAr()?'شهادات مطابقة سابر/SASO للمنتجات الكهربائية':'Saber/SASO conformity for electrical products','','integr'],
    [true,isAr()?'سياسة خصوصية متوافقة مع نظام حماية البيانات الشخصية':'PDPL-compliant privacy policy','','legal'],
    [S.security.twoFA,isAr()?'التحقق بخطوتين لمستخدمي لوحة التحكم':'Two-factor authentication for admin users','','security'],
    [S.notifications.sms.sender&&S.notifications.sms.sender.length>=3,isAr()?'اسم مرسل SMS مسجّل لدى هيئة الاتصالات':'SMS sender name registered with CST','','notif'],

const ADMIN_VIEWS={dash:viewDash,orders:viewOrders,products:viewProducts,customers:viewCustomers,marketing:viewMarketing,payments:viewPayments,compare:viewCompare,shipping:viewShipping,tax:viewTax,notif:viewNotif,store:viewStore,appear:viewAppear,locale:viewLocale,checkout:viewCheckoutSettings,legal:viewLegal,seo:viewSeo,users:viewUsers,integr:viewIntegr,api:viewApi,security:viewSecurity,compliance:viewCompliance,backup:viewBackup};
</script>
<script>
/* ================= ACTIONS ================= */
const rnd=(n)=>Array.from({length:n},()=>'abcdef0123456789'[Math.floor(Math.random()*16)]).join('');
const ACT={
  annClose(){ U.annClosed=S.appearance.announceAr+S.appearance.announceEn; save(); render(); },
  mode(d){ U.mode=d.v; if(d.v==='admin'&&!U.admin) U.admin='dash'; save(); render(); window.scrollTo({top:0}); },
  lang(){ U.lang=isAr()?'en':'ar'; save(); render(); },
  theme(){ U.theme=U.theme==='dark'?'light':'dark'; save(); render(); },
  go(d){ const p={}; if(d.cat) p.cat=d.cat; if(d.id) p.id=d.id; if(d.slug) p.slug=d.slug; if(d.tab) p.tab=d.tab; if(d.found) p.found=d.found; if(d.q) p.q=d.q; if(d.v==='cat'&&(d.cat||'')!==(U.params.cat||'')) U.f.brands=[]; closeModal(); go(d.v,p); },
  brand(d){ U.f.brands=[d.b]; go('cat',{}); },
  slide(d){ U.slide=+d.i; save(); render(); },
  toast(d){ toast(d.msg,'good'); },
  copy(d){ copyText(d.v); },
  closeModal(){ closeModal(); },
  closeModalBg(d,el,e){ if(e.target===el) closeModal(); },
  openCart(){ document.getElementById('overlay').innerHTML=cartDrawer(); },
  addCart(d){ addCart(d.id,1); if(document.querySelector('.drawer')) document.getElementById('overlay').innerHTML=cartDrawer(); },
  addCartQ(d){ const q=Math.max(1,parseInt((document.getElementById('pq')||{}).value||'1')); addCart(d.id,q); },
  buyNow(d){ const q=Math.max(1,parseInt((document.getElementById('pq')||{}).value||'1')); const p=prod(d.id); if(!p||p.stock<=0) return; const l=U.cart.find(c=>c.id===d.id); if(l) l.qty=Math.min(l.qty+q,p.stock); else U.cart.push({id:d.id,qty:q}); startCheckout(); },
  pq(d){ const i=document.getElementById('pq'); i.value=Math.max(1,(parseInt(i.value)||1)+(+d.d)); },
  cq(d){ const l=U.cart.find(c=>c.id===d.id); if(!l) return; l.qty+=+d.d; if(l.qty<=0) U.cart=U.cart.filter(c=>c!==l); const p=prod(d.id); if(p&&l.qty>p.stock) l.qty=p.stock; save(); const y=window.scrollY; render(); window.scrollTo({top:y}); if(document.querySelector('.drawer')) document.getElementById('overlay').innerHTML=cartDrawer(); },
  rm(d){ U.cart=U.cart.filter(c=>c.id!==d.id); save(); const y=window.scrollY; render(); window.scrollTo({top:y}); if(document.querySelector('.drawer')) document.getElementById('overlay').innerHTML=cartDrawer(); },
  wish(d){ const i=U.wish.indexOf(d.id); if(i>=0) U.wish.splice(i,1); else U.wish.push(d.id); save(); const y=window.scrollY; render(); window.scrollTo({top:y}); },
  cmp(d){ const i=U.cmp.indexOf(d.id); if(i>=0) U.cmp.splice(i,1); else { if(U.cmp.length>=4){ toast(t('cmp_max'),'bad'); return; } U.cmp.push(d.id); toast(t('compare')+' ✓','good'); } save(); const y=window.scrollY; render(); window.scrollTo({top:y}); },
  clearF(){ U.f={brands:[],min:'',max:'',rating:0,stock:false,saber:false,sort:U.f.sort}; save(); render(); },
  startCheckout(){ startCheckout(); },
  coOtp(){ if(!U.co.phone||U.co.phone.replace(/\D/g,'').length<9){ toast(t('phone'),'bad'); return; } U.co.otpSent=true; save(); render(); toast((isAr()?'أُرسل رمز التحقق إلى ':'OTP sent to ')+U.co.phone+' ('+(isAr()?'محاكاة':'simulated')+')','good'); },
  coVerify(){ U.co.verified=true; U.co.step=2; if(!U.user){ U.user={id:'c1',name:isAr()?'عبدالله الشمري':'Abdullah Alshammari',phone:U.co.phone}; U.co.name=U.user.name; } save(); render(); },
  coGuest(){ U.co.verified=true; U.co.step=2; save(); render(); },
  coBack(){ U.co.step=Math.max(1,U.co.step-1); save(); render(); },
  coNext(){ const co=U.co; if(co.step===2){ if(!co.name){ toast(t('full_name'),'bad'); return; } if(S.checkout.requireNationalAddress&&!co.addr.short&&!co.addr.building){ toast(t('nat_addr'),'bad'); return; } } if(co.step===4&&!co.pm) return; co.step=Math.min(5,co.step+1); save(); render(); },
  coLookup(){ const co=U.co; const code=(co.addr.short||'RRRD2929').toUpperCase(); co.addr.short=code; co.addr.building='2929'; co.addr.street=isAr()?'شارع الأمير محمد بن عبدالعزيز':'Prince Mohammed bin Abdulaziz St'; co.addr.district=isAr()?'العليا':'Al Olaya'; co.addr.city=S.shipping.cities[0]; co.addr.postal='12214'; co.addr.addl='6587'; save(); render(); toast(t('addr_found'),'good'); },
  coCarrier(d){ U.co.carrier=d.id; save(); render(); },
  coPm(d){ U.co.pm=d.id; save(); render(); },
  coPay(){ if(U.co.step<5){ U.co.step=5; save(); render(); return; } simulatePayment(); },
  payOk(){ const pm=U.co.pm; openModal(`<div class="processing"><div class="spinner"></div><h3>${esc(t('processing'))}</h3><p class="muted small">${esc(isAr()?'جارٍ التحقق من الدفع عبر الويب هوك...':'Confirming payment via webhook...')}</p></div>`,'sm'); setTimeout(()=>placeOrder('paid'),1200); },
  payFail(){ closeModal(); toast(isAr()?'تم إلغاء الدفع. لم يُخصم أي مبلغ.':'Payment cancelled. Nothing was charged.','bad'); },
  logout(){ U.user=null; save(); go('home'); },
  /* admin */
  anav(d){ U.admin=d.v; U.mode='admin'; save(); render(); window.scrollTo({top:0}); },
  atab(d){ U.atab[d.k]=d.v; save(); render(); },
  toggle(d){ setPath(d.bind, !getPath(d.bind)); audit('Toggled '+d.bind); save(); render(); toast(t('settings_saved'),'good'); },
  gwMode(d){ S.payments[d.gw].mode=d.v; S.payments[d.gw].status='untested'; audit(`${d.gw} mode → ${d.v}`); save(); render(); },
  testConn(d,el){ const g=S.payments[d.gw]; el.disabled=true; el.innerHTML=`<span class="spinner" style="width:14px;height:14px;border-width:2px;margin:0"></span> …`; setTimeout(()=>{ const keyField=g.secKey??g.apiToken??g.accessToken??g.serverKey??''; const ok=keyField&&keyField.length>8&&(g.mode==='test'?!/live/.test(keyField):!/test|sandbox/.test(keyField)); g.status=ok?'ok':'bad'; audit(`Test connection ${d.gw}: ${ok?'OK':'FAILED'}`); save(); render(); toast(ok?t('conn_ok'):t('conn_bad'), ok?'good':'bad'); },1100); },
  reveal(d,el){ const inp=el.closest('.keyrow').querySelector('input'); inp.type=inp.type==='password'?'text':'password'; },
  regen(d){ S.api[d.k]=(d.k==='apiKey'?'fam_live_':'whsec_')+rnd(32); audit('Regenerated '+d.k); save(); render(); toast(t('saved'),'good'); },
  zatcaOnboard(){ if(!S.tax.zatcaOtp||S.tax.zatcaOtp.length<6){ toast(t('zatca_otp'),'bad'); return; } S.tax.zatcaStatus='onboarded'; S.tax.zatcaCsid='TUlJQ'+rnd(28).toUpperCase(); audit('ZATCA CSID issued ('+S.tax.zatcaEnv+')'); save(); render(); toast(t('onboarded'),'good'); },
  oview(d){ orderModal(d.id); },
  orefund(d){ const o=D.orders.find(x=>x.id===d.id); o.status='refunded'; D.whlog.unshift({at:new Date().toISOString(),ev:'order.refunded',id:o.id,code:200}); audit('Refund '+o.id); save(); render(); orderModal(d.id); toast(t('refunded_ok'),'good'); },
  pedit(d){ productModal(d.id); },
  pdel(d){ D.products=D.products.filter(p=>p.id!==d.id); audit('Deleted product '+d.id); save(); render(); },
  ptoggle(d){ const p=prod(d.id); p.active=p.active===false?true:false; save(); render(); },
  cedit(d){ couponModal(d.i==='new'?'new':+d.i); },
  cdel(d){ S.coupons.splice(+d.i,1); save(); render(); },
  uedit(d){ openModal(`${modalHead(t('add_user'))}<form class="modal-b form" data-submit="usave"><div class="field"><label>${t('name')}</label><input name="name" required></div><div class="field"><label>${t('email')}</label><input name="email" type="email" class="ltr" required></div><div class="field"><label>${t('role')}</label><select name="role">${['admin','fulfilment','support','accountant'].map(r=>`<option value="${r}">${t('r_'+r)}</option>`).join('')}</select></div><div class="modal-f" style="padding:0;border:0"><button class="btn ghost" type="button" data-act="closeModal">${t('cancel')}</button><button class="btn primary" type="submit">${t('save')}</button></div></form>`,'sm'); },
  udel(d){ S.users.splice(+d.i,1); save(); render(); },
  whAdd(){ openModal(`${modalHead(t('add_endpoint'))}<form class="modal-b form" data-submit="whsave"><div class="field"><label>URL</label><input name="url" class="ltr" placeholder="https://apex.example.com/ords/fam/webhooks" required></div><div class="field"><label>${t('events_col')}</label><select name="events"><option>order.*</option><option>order.paid</option><option>order.shipped</option><option>refund.*</option><option>product.stock_low</option></select></div><div class="modal-f" style="padding:0;border:0"><button class="btn ghost" type="button" data-act="closeModal">${t('cancel')}</button><button class="btn primary" type="submit">${t('save')}</button></div></form>`,'sm'); },
  whDel(d){ S.api.endpoints.splice(+d.i,1); save(); render(); },
  whTest(d){ const e=S.api.endpoints[+d.i]; D.whlog.unshift({at:new Date().toISOString(),ev:'ping',id:e.url.replace(/^https?:\/\//,'').slice(0,28),code:e.enabled?200:503}); save(); render(); toast(e.enabled?'200 OK':'503 disabled', e.enabled?'good':'bad'); },
  accent(d){ S.appearance.accent=d.v; audit('Accent → '+d.v); save(); render(); },
  copyExport(){ copyText(document.getElementById('exportJson').value); },
  importJson(){ try{ const o=JSON.parse(document.getElementById('importJson').value); if(o.settings){ S=merge(clone(DEFAULT_SETTINGS),o.settings); audit('Imported settings'); save(); render(); toast(t('saved'),'good'); } else throw 0; }catch(e){ toast('Invalid JSON','bad'); } },
  resetAsk(){ openModal(`${modalHead(t('bk_reset'))}<div class="modal-b">${esc(t('bk_reset_sure'))}</div><div class="modal-f"><button class="btn ghost" data-act="closeModal">${t('cancel')}</button><button class="btn danger" data-act="resetDo">${t('yes_reset')}</button></div>`,'sm'); },
  resetDo(){ try{localStorage.removeItem(KEY);}catch(e){} const lang=U.lang, theme=U.theme; load(); U.lang=lang; U.theme=theme; U.mode='admin'; U.admin='backup'; closeModal(); save(); render(); toast(t('saved'),'good'); },
};
const FORMS={
  search(f){ const q=f.querySelector('#q').value.trim(); document.getElementById('sugg').hidden=true; go('cat',{q}); },
  coupon(f){ const code=f.querySelector('#cpn').value.trim().toUpperCase(); const tt=totals(); const cp=S.coupons.find(c=>c.code===code&&c.active); if(cp&&tt.sub>=cp.min){ U.coupon=code; toast(t('coupon_ok'),'good'); } else { U.coupon=null; toast(t('coupon_bad'),'bad'); } save(); render(); },
  login(f){ U.user={id:'c1',name:isAr()?'عبدالله الشمري':'Abdullah Alshammari',phone:f.querySelector('#lp').value,email:'abdullah@example.com'}; save(); go('account',{tab:'orders'}); },
  quote(){ toast(t('quote_ok'),'good'); go('home'); },
  track(f){ go('track',{found:f.querySelector('#trk').value.trim().toUpperCase()}); },
  return(){ toast(t('return_ok'),'good'); },
  psave(f){ const fd=new FormData(f); const id=f.dataset.id; const p=id==='new'?{id:'p'+String(D.products.length+1).padStart(2,'0'),rating:0,reviews:0,badges:[]}:prod(id);
    p.name={ar:fd.get('nar'),en:fd.get('nen')}; p.cat=fd.get('cat'); p.brand=fd.get('brand'); p.price=+fd.get('price'); p.old=+fd.get('old')||0; p.cost=+fd.get('cost')||0; p.stock=+fd.get('stock')||0; p.weight=+fd.get('weight')||0; p.saberNo=fd.get('saberNo'); p.saber=!!fd.get('saber'); p.desc={ar:fd.get('dar'),en:fd.get('den')};
    p.specs=String(fd.get('specs')||'').split('\n').map(l=>l.split('|')).filter(a=>a.length>=2&&a[0].trim()).map(a=>[a[0].trim(),a.slice(1).join('|').trim()]); p.badges=[...(fd.get('best')?['best']:[]),...(fd.get('new')?['new']:[])];
    if(id==='new') D.products.unshift(p); audit((id==='new'?'Added':'Edited')+' product '+p.id); closeModal(); save(); render(); toast(t('saved'),'good'); },
  csave(f){ const fd=new FormData(f); const i=f.dataset.i; const c=i==='new'?{uses:0,active:true}:S.coupons[+i]; c.code=String(fd.get('code')).toUpperCase().trim(); c.type=fd.get('type'); c.value=+fd.get('value'); c.min=+fd.get('min')||0; if(i==='new') S.coupons.push(c); closeModal(); save(); render(); toast(t('saved'),'good'); },
  usave(f){ const fd=new FormData(f); S.users.push({id:'u'+Date.now(),name:fd.get('name'),email:fd.get('email'),role:fd.get('role'),active:true}); audit('Added user '+fd.get('email')); closeModal(); save(); render(); toast(t('saved'),'good'); },
  whsave(f){ const fd=new FormData(f); S.api.endpoints.push({url:fd.get('url'),events:fd.get('events'),enabled:true}); closeModal(); save(); render(); toast(t('saved'),'good'); },
};

/* ================= RENDER ================= */
const VIEWS={home:viewHome,cat:viewCat,product:viewProduct,cart:viewCart,checkout:viewCheckout,confirm:viewConfirm,account:viewAccount,wishlist:viewWishlist,compare:viewCompare,page:viewPage,quote:viewQuote,track:viewTrack};
function render(){
  applyTheme();
  const app=document.getElementById('app');
  let html=demobar();
  if(U.mode==='admin') html+=adminView();
  else if(S.maintenance.enabled) html+=viewMaint();
  else { const fn=VIEWS[U.view]||viewHome; html+=shopHeader()+`<main style="min-height:50vh">${fn()}</main>`+shopFooter(); }
  app.innerHTML=html;
  document.title=(isAr()?S.store.shortAr:S.store.shortEn)+(U.mode==='admin'?' · '+t('admin'):'');
  drawQRs();
}
function drawQRs(){ document.querySelectorAll('canvas[data-qr]').forEach(c=>{ if(!c.dataset.done){ drawQR(c,c.dataset.qr); c.dataset.done='1'; } }); }

/* ================= EVENTS ================= */
document.addEventListener('click', e=>{
  const el=e.target.closest('[data-act]'); if(!el) return;
  if(el.tagName==='A') return;
  const act=el.dataset.act; if(ACT[act]){ e.preventDefault(); ACT[act](el.dataset, el, e); }
});
document.addEventListener('submit', e=>{ const f=e.target.closest('form[data-submit]'); if(!f) return; e.preventDefault(); const h=FORMS[f.dataset.submit]; if(h) h(f); });
let saveTimer=null;
function bindFrom(el){
  const path=el.dataset.bind; let v;
  if(el.type==='checkbox') v=el.checked; else if(el.type==='number'||el.type==='range') v=el.value===''?'':+el.value; else v=el.value;
  if(path==='S.shipping.citiesText'){ S.shipping.cities=String(v).split('\n').map(s=>s.trim()).filter(Boolean); } else setPath(path, v);
  if(path==='S.appearance.radius') applyTheme();
  if(path==='S.appearance.themeDefault') U.theme=v;
  if(path==='S.locale.defaultLang') U.lang=v;
  clearTimeout(saveTimer); saveTimer=setTimeout(()=>{ audit('Changed '+path); save(); toast(t('settings_saved'),'good'); }, 600);
}
document.addEventListener('change', e=>{
  const el=e.target;
  if(el.dataset.bind){ bindFrom(el); if(el.dataset.rerender||el.tagName==='SELECT'||el.type==='checkbox'){ save(); render(); } return; }
  if(el.dataset.co){ const co=U.co; const parts=el.dataset.co.split('.'); let v=el.type==='checkbox'?el.checked:el.value; if(parts.length===2) co[parts[0]][parts[1]]=v; else co[parts[0]]=v; save(); if(el.dataset.co==='agree') render(); return; }
  if(el.dataset.actChange==='ostatus'){ const o=D.orders.find(x=>x.id===el.dataset.id); o.status=el.value; D.whlog.unshift({at:new Date().toISOString(),ev:'order.'+el.value,id:o.id,code:200}); audit(`Order ${o.id} → ${el.value}`); save(); render(); orderModal(o.id); return; }
  if(el.dataset.f){ const k=el.dataset.f; U.f[k]=el.type==='checkbox'?el.checked:el.value; save(); render(); return; }
  if(el.dataset.fb){ const b=el.dataset.fb; if(el.checked){ if(!U.f.brands.includes(b)) U.f.brands.push(b); } else U.f.brands=U.f.brands.filter(x=>x!==b); save(); render(); return; }
  if(el.dataset.fr){ U.f.rating=+el.dataset.fr; save(); render(); return; }
});
document.addEventListener('input', e=>{
  const el=e.target;
  if(el.dataset.bind && el.type!=='checkbox' && el.tagName!=='SELECT'){ bindFrom(el); if(el.type==='range') { const lab=el.closest('.field').querySelector('label'); if(lab) lab.textContent=t('radius')+': '+el.value+'px'; } return; }
  if(el.dataset.co){ const parts=el.dataset.co.split('.'); if(parts.length===2) U.co[parts[0]][parts[1]]=el.value; else U.co[parts[0]]=el.value; return; }
  if(el.dataset.atabInput){ U.atab[el.dataset.atabInput]=el.value; clearTimeout(saveTimer); saveTimer=setTimeout(()=>{ const pos=el.selectionStart; save(); render(); const n=document.querySelector('[data-atab-input]'); if(n){ n.focus(); n.setSelectionRange(pos,pos); } },350); return; }
  if(el.dataset.actInput==='accent'){ S.appearance.accent=el.value; applyTheme(); clearTimeout(saveTimer); saveTimer=setTimeout(()=>{save(); render();},500); return; }
  if(el.id==='q'){ const q=el.value.trim().toLowerCase(); const box=document.getElementById('sugg'); if(!q){ box.hidden=true; return; } const m=D.products.filter(p=>p.name.ar.includes(el.value.trim())||p.name.en.toLowerCase().includes(q)||p.brand.toLowerCase().includes(q)).slice(0,6); box.innerHTML=m.map(p=>`<button type="button" data-act="go" data-v="product" data-id="${p.id}"><span style="width:28px;height:28px;display:inline-grid;place-items:center">${pIcon(p).replace('<svg','<svg style="width:20px;height:20px;stroke:var(--fg)"')}</span><span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(L(p.name))}</span><b class="num small">${money(p.price)}</b></button>`).join('')+`<button type="button" data-act="go" data-v="cat" data-q="${esc(el.value.trim())}" class="muted">${I.search.replace('<svg','<svg style="width:16px;height:16px"')} ${t('search')} "${esc(el.value.trim())}"</button>`; box.hidden=!m.length&&!q; }
});
document.addEventListener('mouseover', e=>{
  const h=e.target.closest('.hit'); if(!h) return; const tt=document.getElementById('ctt'); if(!tt) return;
  tt.hidden=false; tt.setAttribute('transform',`translate(${h.dataset.cx},${h.dataset.cy})`); const texts=tt.querySelectorAll('text'); texts[0].textContent=h.dataset.lbl; texts[1].textContent=h.dataset.val;
});
document.addEventListener('mouseout', e=>{ if(e.target.closest&&e.target.closest('[data-chart]')&&!e.relatedTarget?.closest?.('[data-chart]')){ const tt=document.getElementById('ctt'); if(tt) tt.hidden=true; } });
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeModal(); });
setInterval(()=>{ const cd=document.getElementById('cd'); if(!cd) return; let ms=Math.max(0,+cd.dataset.end-Date.now()); const h=Math.floor(ms/36e5), m=Math.floor(ms%36e5/6e4), s=Math.floor(ms%6e4/1e3); cd.innerHTML=[h,m,s].map(n=>`<span>${String(n).padStart(2,'0')}</span>`).join(''); },1000);

/* ================= INIT ================= */
load();
if(location.hash==='#admin') U.mode='admin';
render();
</script>
